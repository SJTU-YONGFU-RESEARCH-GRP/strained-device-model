title: BSIM4 NMOS transient profile library (ngspice)

device:
  subckt: bsim4_nmos
  drain_port: d
  gate_port: g
  source_port: s
  bulk_port: b
  mobility_control_port: null
  instance_params:
    W: 10u
    L: 180n

strain:
  nu: 0.47
  beta: 0.8
  gamma: 0.0
  vth0: 0.40
  mu0: 0.04

dynamic:
  mechanical_tau: 0.05
  beta_r: 2.0
  gamma_r: 0.0
  hysteresis:
    enabled: true
    tau_load: 0.02
    tau_unload: 0.10

transient:
  enabled: true
  run_all_presets: true
  tstop: 5.0
  tstep: 0.01
  profile:
    amplitude: 0.005
    frequency: 0.3
    offset: 0.0
    alpha: 0.0

bias:
  vdd: 1.0
  vgs: 0.75
  vss: 0.0

sweeps:
  strain_magnitude:
    eps_s_max: 0.005
    steps: 11
    alpha: 0.0
  strain_direction:
    eps_s: 0.005
    alpha_max: 1.5707963267948966
    steps: 17
  transfer:
    enabled: true
    vgs_min: 0.0
    vgs_max: 1.2
    steps: 25
    eps_s_cases: [0.0, 0.0025, 0.005]
    alpha: 0.0
