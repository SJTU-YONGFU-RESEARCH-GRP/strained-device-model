title: Strain demo MOS transient profile library (Spectre)

simulator: spectre

device:
  subckt: strain_demo_mos
  drain_port: d
  gate_port: g
  source_port: s
  bulk_port: b
  mobility_control_port: null
  instance_params:
    kp: 2e-4
    vth: 0.35

strain:
  nu: 0.47
  beta: 0.6
  gamma: 0.0
  vth0: 0.35
  mu0: 0.02

dynamic:
  mechanical_tau: 0.05
  beta_r: 1.5
  gamma_r: 0.0
  hysteresis:
    enabled: true
    tau_load: 0.02
    tau_unload: 0.10

transient:
  enabled: true
  run_all_presets: true
  tstop: 5.0
  tstep: 0.01
  profile:
    amplitude: 0.005
    frequency: 0.3
    offset: 0.0
    alpha: 0.0

bias:
  vdd: 1.0
  vgs: 0.55
  vss: 0.0

sweeps:
  strain_magnitude:
    eps_s_max: 0.005
    steps: 9
    alpha: 0.0
  strain_direction:
    eps_s: 0.005
    alpha_max: 1.5707963267948966
    steps: 13
  transfer:
    enabled: true
    vgs_min: 0.0
    vgs_max: 1.0
    steps: 21
    eps_s_cases: [0.0, 0.0025, 0.005]
    alpha: 0.0
